# EJEMPLO FICTICIO de poblaciones y partición para el ensayo de F4.3 con el dataset
# sintético del OE3. NO es la configuración del proyecto: DP-01d, DP-04, DP-05 y
# DP-17 siguen abiertas. La partición copia la del generador
# (particion_temporal_cohortes.csv): cohortes 1 a 8 de desarrollo, 9 y 10 de
# prueba, 11 y 12 sin seguimiento completo.
version_poblaciones: 1
nombre: "Poblaciones y partición ficticias del ensayo con el dataset del OE3 (F4.3)"
ficticio: true

# Generador: o(T0) es el cierre de matrícula del ciclo 1 y o(Tj), el cierre de notas
# del ciclo j. En el formato del motor, la información de Tj se consolida al final
# del ciclo j y T0 no tiene ningún ciclo cerrado.
periodo_indice:
  T0: 0
  T1: 1
  T2: 2
  T3: 3

diseno_principal: D1
analisis_complementarios: [D2, D3]

particion:
  cohortes_piloto: []
  cohortes_desarrollo: ["2011-1", "2011-2", "2012-1", "2012-2", "2013-1", "2013-2", "2014-1", "2014-2"]
  cohortes_prueba: ["2015-1", "2015-2"]
  # Sin seguimiento completo en el generador: sus etiquetas conocidas no son una
  # muestra al azar (README del dataset, supuesto 2).
  cohortes_excluidas: ["2016-1", "2016-2"]
  plan_contingencia: >-
    EJEMPLO FICTICIO. Si las cohortes con seguimiento completo no alcanzan para
    desarrollo y prueba, se registra una desviación antes de ver resultados.
