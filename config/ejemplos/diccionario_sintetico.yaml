# EJEMPLO FICTICIO de diccionario de datos, para el generador sintético de pruebas.
# NO es el diccionario del proyecto (DP-03, DP-15): los bloques y las ventanas
# mínimas de los rasgos son supuestos inventados, no decisiones.
#
# Formato: una fila por estudiante y ciclo (historial de matrícula).
version_diccionario: 1
nombre: "Diccionario sintético de prueba (H2.3)"
ficticio: true

# Columnas que identifican cada fila. Tras la seudonimización,
# codigo_estudiante se reemplaza por la columna 'seudonimo'.
clave: [codigo_estudiante, ciclo]

variables:
  - {nombre: codigo_estudiante, tipo: codigo, rol: identificador, obligatoria: true, patron: "[0-9]{8}"}
  - {nombre: origen_datos, tipo: categoria, rol: origen, obligatoria: true, valores: [SINTETICO]}
  - {nombre: cohorte, tipo: codigo, rol: cohorte, obligatoria: true, patron: "20[0-9]{2}-[12]"}
  - {nombre: ciclo, tipo: entero, rol: periodo, obligatoria: true, minimo: 1, maximo: 8}
  - {nombre: fecha_registro, tipo: fecha, rol: fecha, obligatoria: true}
  # Fuente del objetivo (H2.4): su distribución no se muestra en la auditoría.
  - nombre: estado_matricula
    tipo: categoria
    rol: objetivo
    obligatoria: true
    valores: [matriculado, no_matriculado, reserva, retiro_total, traslado]
  # Rasgos (candidatos a predictores) con bloque y ventana mínima ficticios.
  - {nombre: puntaje_admision, tipo: decimal, rol: rasgo, obligatoria: true, bloque: A, ventana_minima: T0, minimo: 0, maximo: 100}
  - {nombre: promedio_ciclo, tipo: decimal, rol: rasgo, obligatoria: false, bloque: A, ventana_minima: T1, minimo: 0, maximo: 20}
  - {nombre: creditos_aprobados_ciclo, tipo: entero, rol: rasgo, obligatoria: false, bloque: A, ventana_minima: T1, minimo: 0, maximo: 30}
  - {nombre: beca_al_ingreso, tipo: booleano, rol: rasgo, obligatoria: true, bloque: F, ventana_minima: T0}
  - {nombre: deuda_vencida_ciclo, tipo: booleano, rol: rasgo, obligatoria: false, bloque: F, ventana_minima: T1}
  - {nombre: tipo_colegio, tipo: categoria, rol: rasgo, obligatoria: true, bloque: S, ventana_minima: T0, valores: [publico, privado]}
  - {nombre: rango_ingreso_familiar, tipo: categoria, rol: rasgo, obligatoria: false, bloque: S, ventana_minima: T1, valores: [bajo, medio, alto]}
  - {nombre: horas_plataforma_ciclo, tipo: decimal, rol: rasgo, obligatoria: false, bloque: B, ventana_minima: T1, minimo: 0, maximo: 500}
